# Reference for P2-05 -> copy to .github/workflows/zap.yml and .zap/rules.tsv
# ZAP *baseline* = spider + passive rules only. Never point an active scan at prod.
name: zap-baseline

on:
  schedule:
    - cron: "17 3 * * 1"       # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      target:
        description: "Base URL of dev or test (https://...)"
        required: true
        type: string

permissions: {}

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dev           # variable ZAP_TARGET lives here; no Azure login, no secrets needed
    permissions:
      contents: read
    env:
      TARGET: ${{ inputs.target || vars.ZAP_TARGET }}
    steps:
      - uses: actions/checkout@<commit-sha> # v<x.y.z>
        with:
          persist-credentials: false
      - name: Refuse anything that is not https or looks like prod
        run: |
          case "$TARGET" in https://*) ;; *) echo "::error::target must be https"; exit 1;; esac
          case "$TARGET" in *prod*) echo "::error::baseline runs against dev/test only"; exit 1;; esac
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@<commit-sha> # v<x.y.z> - check the current version and inputs
        with:
          target: ${{ env.TARGET }}
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-report
